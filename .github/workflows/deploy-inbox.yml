name: Deploy inbox

# Ships apps/inbox (the standalone email worker -- email handler only,
# never-reject doctrine) after gates pass on main. Separate workflow from
# apps/web on purpose: the inbox deploys on its own cadence.
#
# Rafters internal packages resolve as sibling-clone workspace members
# pinned to RAFTERS_REF -- see ci.yml for the doctrine.

on:
  push:
    branches: [main]
    paths:
      - "apps/inbox/**"
      - ".github/workflows/deploy-inbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-inbox
  cancel-in-progress: false

env:
  RAFTERS_REF: 9c95a6d6fca47005cb6f1d930597d4dde93f7917

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: rafters-studio/rafters
          ref: ${{ env.RAFTERS_REF }}
          path: rafters

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: |
          mkdir -p "$(pnpm bin)"
          printf '#!/bin/sh\nexit 0' > "$(pnpm bin)/lefthook"
          chmod +x "$(pnpm bin)/lefthook"
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck inbox
        run: pnpm --filter @rafters-studio/inbox typecheck

      - name: Test
        run: pnpm test

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: rafters-studio/rafters
          ref: ${{ env.RAFTERS_REF }}
          path: rafters

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: |
          mkdir -p "$(pnpm bin)"
          printf '#!/bin/sh\nexit 0' > "$(pnpm bin)/lefthook"
          chmod +x "$(pnpm bin)/lefthook"
          pnpm install --frozen-lockfile

      - name: Deploy apps/inbox
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/apps/inbox
          command: deploy
