name: Deploy ctrl

# Ships apps/ctrl (admin SPA, static assets behind a prefix-stripping
# worker) to rafters.studio/ctrl/* after gates pass on main.
#
# Rafters internal packages resolve as sibling-clone workspace members
# pinned to RAFTERS_REF -- see ci.yml for the doctrine.

on:
  push:
    branches: [main]
    paths:
      - "apps/ctrl/**"
      - ".github/workflows/deploy-ctrl.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ctrl
  cancel-in-progress: false

env:
  RAFTERS_REF: 9c95a6d6fca47005cb6f1d930597d4dde93f7917

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: rafters-studio/rafters
          ref: ${{ env.RAFTERS_REF }}
          path: rafters

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: |
          mkdir -p "$(pnpm bin)"
          printf '#!/bin/sh\nexit 0' > "$(pnpm bin)/lefthook"
          chmod +x "$(pnpm bin)/lefthook"
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build ctrl (tsc app + worker, vite build)
        run: pnpm --filter @rafters-studio/ctrl build

      - name: Deploy apps/ctrl
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/apps/ctrl
          command: deploy
