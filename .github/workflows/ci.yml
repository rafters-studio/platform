name: CI

# Rafters internal packages (@rafters/color-utils, @rafters/shared) are never
# published -- they resolve as sibling-clone workspace members. Every job that
# runs pnpm install checks out rafters-studio/rafters next to this repo,
# pinned to RAFTERS_REF. Bump the ref deliberately when platform needs newer
# rafters source; a mismatch fails typecheck here, never in production.

on:
  push:
    branches: [main]
  pull_request:

env:
  RAFTERS_REF: 9c95a6d6fca47005cb6f1d930597d4dde93f7917

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: rafters-studio/rafters
          ref: ${{ env.RAFTERS_REF }}
          path: rafters

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: |
          mkdir -p "$(pnpm bin)"
          printf '#!/bin/sh\nexit 0' > "$(pnpm bin)/lefthook"
          chmod +x "$(pnpm bin)/lefthook"
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
